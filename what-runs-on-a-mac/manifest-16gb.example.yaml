# Example profile for a 16 GB Apple-silicon Mac (measured on a MacBook Air M3 16 GB): one timed run per model, 1K context.
# Every model is pinned to a full commit SHA. Run `python -m bench.download` (or `--verify` for models you already have):
# the harness refuses to load anything without a verified hash record. Read every repo's licence before downloading.
# Never run a manifest you didn't write or read: it chooses which files are downloaded and which binaries run.
#
# Voice: media.voice.references is empty on purpose. Add {id, file, text} for a reference voice YOU have the right to
# clone (your own recording and its exact transcript). Video (MiniMax H3) is not included: its licence requires your own
# authorisation from MiniMax; the runner code is in bench/media/ if you have one.
machine:
  label: describe your Mac here (the harness also records the real hardware on every row)
  iogpu_wired_limit_mb: 0
disk_guard:
  internal_path: /System/Volumes/Data
  internal_floor_gb: 25
  internal_warn_gb: 40
  external_path: /Volumes/__none__
  external_floor_gb: 0
  check_every_s: 30
settings:
  temperature: 0
  seed: 17
  max_output_tokens: 512
  warmup_reps: 1
  timed_reps: 1
  prompt_cache: false
  context_source: inputs/context_corpus.txt
  needle: The archive password is HELIOTROPE-4471.
  needle_answer: HELIOTROPE-4471
  needle_depths:
  - 0
  - 25
  - 50
  - 75
  - 100
  needle_tries: 3
  allowed_weight_formats:
  - safetensors
  - gguf
models:
  qwen35-4b:
    name: Qwen 3.5 4B
